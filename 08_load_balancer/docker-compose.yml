version: '3.8'

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_cont
    ports:
      - "80:80"     # Expose port 80 to host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Mount config (READ_ONLY)
    depends_on:
      - fastapi1
      - fastapi2
    networks:
      - nginx_network
    restart: unless-stopped

  # FastAPI Instance 1
  fastapi1:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY app/ .
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: fastapi1_cont
    environment:
      - INSTANCE_ID=FastAPI-1
    networks:
      - nginx_network
    restart: unless-stopped
    # No ports exposed to host - only accessible via Nginx

  # FastAPI Instance 2
  fastapi2:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY app/ .
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: fastapi2_cont
    environment:
      - INSTANCE_ID=FastAPI-2
    networks:
      - nginx_network
    restart: unless-stopped
    # No ports exposed to host - only accessible via Nginx

networks:
  nginx_network:
    driver: bridge

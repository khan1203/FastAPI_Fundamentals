version: "3.9"

services:
  # Kafka broker (KRaft mode - no Zookeeper needed!)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cont1_kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode settings (Kafka without Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller                               # Single node acts as both broker and controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093  # Port 9092: Kafka broker port (client connections) & Port 9093: Controller port (internal, for cluster coordination)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092               # How clients connect to Kafka
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1                            # No replication (single broker)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1                                              # Single partition per topic
      # Confluent-specific KRaft settings
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # MongoDB for storing logs
  mongodb:
    image: mongo:7
    container_name: cont2_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata_kafka:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongodata_kafka:


### Important: This is a simple learning setup!

# => 1 broker (not a cluster)
# => 1 partition (no parallel processing)
# => No replication (data not backed up)
# => Perfect for learning, NOT for production

### Production setups typically use:

# => 3-5 brokers (high availability)
# => Multiple partitions (parallel processing)
# => Replication factor 2-3 (data redundancy)

version: "3.9"

services:
  # PostgreSQL for user profiles
  postgres:
    image: postgres:17
    container_name: postgres_cont1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_info_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_user_info:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_info_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MongoDB for activity logs
  mongodb:
    image: mongo:7
    container_name: mongodb_cont1
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodata_activity_logs:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata_user_info:
  mongodata_activity_logs:
